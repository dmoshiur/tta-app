name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ThinkTank Academia APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: thinktank-academia-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build Release Bundle (AAB)
        run: ./gradlew bundleRelease --no-daemon || gradle bundleRelease --no-daemon
        env:
          KEYSTORE_PATH: ""
          STORE_PASSWORD: "mock_store_password"
          KEY_PASSWORD: "mock_key_password"

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: thinktank-academia-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
